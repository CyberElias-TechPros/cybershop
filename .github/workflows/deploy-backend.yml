name: Deploy backend

# Deploys cybershop-api to Cloudflare Workers on push to main.
# Requires repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
# (Info account). The token must include the Info account in its scope.

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Preflight secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repo secrets (Info account). Add them to enable backend auto-deploy."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      # node_modules must exist or wrangler bundling fails on node builtins.
      - run: npm ci --no-fund --no-audit
        working-directory: worker
      - run: npm run typecheck
        working-directory: worker
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply cybershop --remote
        working-directory: worker
      - run: npx wrangler deploy
        working-directory: worker
      - name: Verify health
        run: |
          body="$(curl -fsS https://cybershop-api.calm-disk-8311.workers.dev/healthz)"
          echo "$body"
          echo "$body" | grep -q '"ok":true' || { echo "::error::cybershop-api health check failed"; exit 1; }
