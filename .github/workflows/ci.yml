name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tools:
    name: Release safeguards — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test scripts/tests/*.test.mjs
      - run: python3 scripts/check-roadmap.py

  media-gateway:
    name: PHP gateway — real HTTP contract
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd
          coverage: none
      - run: php -l media-gateway/upload.php
      - run: python3 media-gateway/test_gateway.py

  worker:
    name: API worker — typecheck + integration suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd
          coverage: none
      - name: Install
        working-directory: worker
        run: npm ci --no-fund --no-audit
      - name: Audit dependencies
        working-directory: worker
        run: npm audit --audit-level=moderate
      - name: Typecheck
        working-directory: worker
        run: npm run typecheck
      - name: Production bundle (no deployment)
        working-directory: worker
        run: npx wrangler deploy --env production --dry-run --outdir .wrangler/release-dry-run
      - name: Test (unit + integration on local wrangler dev)
        working-directory: worker
        timeout-minutes: 10
        run: npm test

  web:
    name: Web — typecheck + production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        working-directory: web
        run: npm ci --no-fund --no-audit
      - name: Audit dependencies
        working-directory: web
        run: npm audit --audit-level=moderate
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: Audit (interactive elements must not nest)
        run: node scripts/web-audit/jsx-nesting.mjs web
      - name: Production build
        working-directory: web
        run: npm run build
      - name: Audit (CSS shipped to every route must stay within budget)
        run: node scripts/web-audit/css-budget.mjs web

  browser:
    name: Browser journeys — desktop + Android viewport (not physical-device acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install API tools
        working-directory: worker
        run: npm ci --no-fund --no-audit
      - name: Install web and pinned browser
        working-directory: web
        run: npm ci --no-fund --no-audit
      - name: Real Next + Worker + isolated D1 browser journeys
        working-directory: web
        run: npm run test:e2e
      - name: Synthetic test failure evidence (no production data)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 3

  android:
    name: Android TWA — debug build, unit tests and lint (not store acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Use the pinned runner Android SDK
        run: |
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build isolated debug identity only
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug 2>&1 | tee /tmp/cybershop-android-build.log
      - name: Record internal candidate identity and signature
        working-directory: android
        run: |
          set -o pipefail
          mkdir -p app/build/reports
          {
            echo 'Internal debug candidate only: not a signed store release or device acceptance.'
            echo "Source commit: $GITHUB_SHA"
            sha256sum app/build/outputs/apk/debug/app-debug.apk
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          } | tee app/build/reports/internal-candidate.txt
      - name: Prove unsigned release requests fail closed
        working-directory: android
        run: |
          if ./gradlew --no-daemon bundleRelease > /tmp/cybershop-release-denial.log 2>&1; then
            echo '::error::Unsigned release unexpectedly succeeded'
            exit 1
          fi
          grep -F 'Release requires approved package/origin/policy' /tmp/cybershop-release-denial.log
      - name: Prove an existing-listing release cannot use default identity or version
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: /tmp/cybershop-nonexistent-synthetic-key
          ANDROID_KEYSTORE_PASSWORD: synthetic-not-a-real-password
          ANDROID_KEY_ALIAS: synthetic-not-a-real-key
          ANDROID_KEY_PASSWORD: synthetic-not-a-real-password
        run: |
          require_denial() {
            if ./gradlew --no-daemon "$@" bundleRelease > /tmp/cybershop-existing-identity-denial.log 2>&1; then
              echo '::error::Release unexpectedly accepted missing existing identity/version'
              exit 1
            fi
            grep -F 'Release requires approved package/origin/policy' /tmp/cybershop-existing-identity-denial.log
          }
          require_denial -PcybershopReleaseApproved=true
          require_denial -PcybershopReleaseApproved=true -PcybershopApplicationId=ng.synthetic.existing
          require_denial -PcybershopReleaseApproved=true -PcybershopApplicationId=ng.synthetic.existing -PcybershopVersionCode=2
      - name: Surface sanitized debug-build diagnostics in checks
        if: failure()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          p=Path('/tmp/cybershop-android-build.log')
          if p.exists():
              text='\n'.join(p.read_text(errors='replace').splitlines()[-100:])[-6000:]
              text=text.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::error title=Android debug build::'+text)
          PYTHON
      - name: Internal debug candidate and reports (not signed for distribution)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-internal-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
          retention-days: 7
          if-no-files-found: ignore
