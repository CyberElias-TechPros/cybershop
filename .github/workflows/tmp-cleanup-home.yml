name: tmp-cleanup-home
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Delete QA test member from homecell-db
        run: |
          U="usr_01M4E8EGQ08457HHKMJTCZYMS1"
          npx -y wrangler@latest d1 execute homecell-db --remote --command "DELETE FROM sessions WHERE user_id='$U';"
          npx -y wrangler@latest d1 execute homecell-db --remote --command "DELETE FROM users WHERE id='$U';"
          npx -y wrangler@latest d1 execute homecell-db --remote --command "SELECT count(*) AS remaining FROM users WHERE id='$U';"
