name: tmp-set-internal-secret
on: workflow_dispatch
jobs:
  set-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Put INTERNAL_SECRET via Cloudflare API
        run: |
          CODE=$(curl -s -o /tmp/out.json -w "%{http_code}" -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/ccb3266ecc6459c52ea1236c173107e2/workers/scripts/cybershop-api/secrets" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg t "${{ secrets.CYBERSHOP_INTERNAL }}" '{name:"INTERNAL_SECRET",text:$t,type:"secret_text"}')")
          echo "HTTP:$CODE"; cat /tmp/out.json; test "$CODE" = "200" -o "$CODE" = "201"
      - name: Verify secret registered
        run: |
          curl -s "https://api.cloudflare.com/client/v4/accounts/ccb3266ecc6459c52ea1236c173107e2/workers/scripts/cybershop-api/secrets" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" | tee /tmp/secrets.json | grep -o '"name":"INTERNAL_SECRET"'
