name: tmp-mig-home
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Clone target repo
        run: git clone --depth 1 https://x-access-token:${{ secrets.MIGRATION_PAT }}@github.com/CyberElias-TechProS/homecell-connect-hub.git target
      - name: Provision D1 + KV (idempotent; old Pain-account IDs unreachable)
        run: |
          DBID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" | jq -r '.result[] | select(.name=="homecell-db") | .uuid' | head -1)
          if [ -z "$DBID" ]; then
            npx -y wrangler@latest d1 create homecell-db
            DBID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" | jq -r '.result[] | select(.name=="homecell-db") | .uuid' | head -1)
          fi
          echo "DBID=$DBID"; test -n "$DBID"; echo "DBID=$DBID" >> $GITHUB_ENV
          KVID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" | jq -r '.result[] | select(.title=="homecell-cache") | .id' | head -1)
          if [ -z "$KVID" ]; then
            npx -y wrangler@latest kv namespace create homecell-cache
            KVID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" | jq -r '.result[] | select(.title=="homecell-cache") | .id' | head -1)
          fi
          echo "KVID=$KVID"; test -n "$KVID"; echo "KVID=$KVID" >> $GITHUB_ENV
      - name: Fill real IDs into worker/wrangler.toml and push back
        run: |
          sed -i "s/4e4bdc6e-b41a-43d8-b9da-8d498a52f23b/$DBID/" target/worker/wrangler.toml
          sed -i "s/dc845a7a301440f59890b208456c0a33/$KVID/g" target/worker/wrangler.toml
          grep -qE "4e4bdc6e|dc845a7a" target/worker/wrangler.toml && { echo "::error::old IDs remain"; exit 1; } || true
          git -C target config user.name "CyberElias-TechPros"
          git -C target config user.email "info@techpros.com.ng"
          git -C target add worker/wrangler.toml
          git -C target commit -m "chore: point homecell-db/CACHE at provisioned resources"
          git -C target push https://x-access-token:${{ secrets.MIGRATION_PAT }}@github.com/CyberElias-TechProS/homecell-connect-hub.git HEAD:main
      - name: Show applied migrations
        working-directory: target/worker
        run: npx -y wrangler@latest d1 migrations list homecell-db --remote
      - name: Apply outstanding migrations
        working-directory: target/worker
        run: npx -y wrangler@latest d1 migrations apply homecell-db --remote
      - name: Install deps and deploy worker
        run: |
          npm ci --no-fund --no-audit --prefix target
          cd target/worker && npx -y wrangler@latest deploy
      - name: Verify health (with propagation retries)
        run: |
          for i in 1 2 3 4 5 6; do
            for path in /api/health /health; do
              if body="$(curl -fsS "https://homecell-api.calm-disk-8311.workers.dev$path")"; then
                echo "$path => $body"; exit 0
              fi
            done
            sleep 20
          done
          echo "::error::no health endpoint answered"; exit 1
