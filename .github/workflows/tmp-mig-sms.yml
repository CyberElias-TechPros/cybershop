name: tmp-mig-sms
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Clone target repo
        run: git clone --depth 1 https://x-access-token:${{ secrets.MIGRATION_PAT }}@github.com/CyberElias-TechPros/ai-sms-sorcery.git target
      - name: Provision D1 + KV + queues (idempotent)
        run: |
          DBID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" | jq -r '.result[] | select(.name=="ai_sms_sorcery") | .uuid' | head -1)
          if [ -z "$DBID" ]; then
            npx -y wrangler@latest d1 create ai_sms_sorcery
            DBID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" | jq -r '.result[] | select(.name=="ai_sms_sorcery") | .uuid' | head -1)
          fi
          echo "DBID=$DBID"; test -n "$DBID"; echo "DBID=$DBID" >> $GITHUB_ENV
          KVID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" | jq -r '.result[] | select(.title=="ai-sms-sorcery-kv") | .id' | head -1)
          if [ -z "$KVID" ]; then
            npx -y wrangler@latest kv namespace create ai-sms-sorcery-kv
            KVID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" | jq -r '.result[] | select(.title=="ai-sms-sorcery-kv") | .id' | head -1)
          fi
          echo "KVID=$KVID"; test -n "$KVID"; echo "KVID=$KVID" >> $GITHUB_ENV
          for q in sms-dispatch sms-dispatch-dlq; do
            npx -y wrangler@latest queues list | grep -q "$q" || npx -y wrangler@latest queues create "$q"
          done
      - name: Fill real IDs into worker/wrangler.toml and push back
        run: |
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$DBID/" target/worker/wrangler.toml
          sed -i "s/REPLACE_WITH_KV_NAMESPACE_ID/$KVID/" target/worker/wrangler.toml
          grep -q REPLACE_WITH target/worker/wrangler.toml && { echo "::error::placeholders remain"; exit 1; } || true
          git -C target config user.name "CyberElias-TechPros"
          git -C target config user.email "info@techpros.com.ng"
          git -C target add worker/wrangler.toml
          git -C target commit -m "chore: fill provisioned Cloudflare D1/KV IDs"
          git -C target push https://x-access-token:${{ secrets.MIGRATION_PAT }}@github.com/CyberElias-TechPros/ai-sms-sorcery.git HEAD:main
      - name: Ensure CREDENTIALS_ENCRYPTION_KEY (only if absent)
        run: |
          HAVE=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/ai-sms-sorcery-api/secrets" | grep -c CREDENTIALS_ENCRYPTION_KEY || true)
          echo "present=$HAVE"
          if [ "$HAVE" = "0" ]; then
            curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/ai-sms-sorcery-api/secrets" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
              --data "$(jq -n --arg t "${{ secrets.TMP_SMS_CREDKEY }}" '{name:"CREDENTIALS_ENCRYPTION_KEY",text:$t,type:"secret_text"}')"
          fi
      - name: Show applied migrations
        working-directory: target/worker
        run: npx -y wrangler@latest d1 migrations list ai_sms_sorcery --remote
      - name: Apply outstanding migrations
        working-directory: target/worker
        run: npx -y wrangler@latest d1 migrations apply ai_sms_sorcery --remote
      - name: Install deps and deploy worker
        working-directory: target/worker
        run: |
          npm ci --no-fund --no-audit
          npx -y wrangler@latest deploy
      - name: Verify health
        run: |
          for path in /api/health /health; do
            if body="$(curl -fsS "https://ai-sms-sorcery-api.calm-disk-8311.workers.dev$path")"; then
              echo "$path => $body"; exit 0
            fi
          done
          echo "::error::no health endpoint answered"; exit 1
